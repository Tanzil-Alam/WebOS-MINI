<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <div
        style="position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background-color: hwb(0 20% 64% / 0.532); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; z-index: 1000;">
        <div id="clock" style="font-size: 20px;"></div>
        <div id="name" style="font-size: 20px; font-weight: bold;">GameOS</div>
        <div id="Date" style="font-size: 20px;"></div>
    </div>



    <div
        style="position: absolute; top: 60px; left: 16px; width: 60px; height: 450px; background-color: hwb(271 81% 3% / 0.352); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;">
        <div class="icon6" onclick="openWindow('App 6', 'app6.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="python.png" style="width: 44px; height: 44px;">
        </div>

        <div class="icon8" onclick="openWindow('App 8', 'snake.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="snake.png" style="width: 44px; height: 44px;">

        </div>
        <div class="icon9" onclick="openWindow('App 9', 'app9.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="icon4.png" style="width: 44px; height: 44px;">
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
